<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>LIVRE · Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf7f2; color: #2b2622; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 24px; }
      main { max-width: 22rem; }
      h1 { font-size: 2rem; letter-spacing: 0.2em; color: #7a5c30; margin: 0 0 1rem; }
      p { margin: 0.5rem 0; line-height: 1.6; font-family: system-ui, sans-serif; color: #5b524a; }
      button { margin-top: 1.5rem; border: 0; border-radius: 999px; background: #1f1a17; color: #fff; padding: 14px 28px; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>LIVRE</h1>
      <p>You're offline. Check your connection and try again.</p>
      <p dir="rtl">لا يوجد اتصال بالإنترنت. تأكدي من الشبكة وحاولي مرة أخرى.</p>
      <button type="button" onclick="location.reload()">Try again · حاولي مجدداً</button>
    </main>
  </body>
</html>
